name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
        sdkmanager --list_installed

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Find APK files
      run: |
        echo "Standard location:"
        find . -name "*.apk" -type f 2>/dev/null || echo "Not found in standard location"
        echo "Custom location:"
        find ~/.everytalk-gradle-build -name "*.apk" -type f 2>/dev/null || echo "Not found in custom location"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CalistaAI-debug
        path: |
          **/*.apk
          ~/.everytalk-gradle-build/**/*.apk
