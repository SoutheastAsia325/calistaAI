name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 37
        build-tools: 37.0.0

    - name: Install SDK components
      run: |
        sdkmanager "platforms;android-37" "build-tools;37.0.0"

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Find APK files
      run: |
        echo "Looking for APK files..."
        find . -name "*.apk" -type f -ls
        echo "Checking custom build directory:"
        ls -la ~/.everytalk-gradle-build/ 2>/dev/null || echo "Custom build dir not found"
        find ~/.everytalk-gradle-build -name "*.apk" -type f -ls 2>/dev/null || echo "No APKs in custom dir"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CalistaAI-debug
        path: |
          **/*.apk
          ~/.everytalk-gradle-build/**/*.apk
